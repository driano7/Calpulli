name: Generate Monthly Recommendations

on:
  schedule:
    # Día 1 de cada mes a las 9:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate recomendaciones-mes content
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/generate-recomendaciones-mes.mjs

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/local-picks/recomendaciones-mes-es.mdx data/local-picks/recomendaciones-mes-en.mdx
          git diff --staged --quiet || git commit -m "chore: actualizar recomendaciones-mes $(date +%Y-%m)"
          git push origin master
